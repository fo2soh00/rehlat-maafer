<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Runs offline in Playwright, never on the site — the Google Fonts link is
     intentional here and is NOT the one Part F removes from app/layout.tsx. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    background: #FFFFFF;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #FFFFFF;
    padding: 74px 80px 68px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: right;
  }

  /* 6px ink rule along the top */
  .rule {
    position: absolute;
    top: 0;
    inset-inline: 0;
    height: 6px;
    background: #111111;
  }

  /* top-right: red dot + brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: "Cairo", sans-serif;
    font-weight: 800;
    font-size: 40px;
    line-height: 1;
    color: #111111;
  }
  .brand .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #E63946;
    flex: 0 0 auto;
  }

  /* centre-right: the title, max 3 lines */
  .title {
    font-family: "Cairo", sans-serif;
    font-weight: 800;
    font-size: 72px;
    line-height: 1.34;
    color: #111111;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* bottom-right: author + role */
  .who .name {
    font-family: "Cairo", sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.5;
    color: #5A5A5A;
  }
  .who .role {
    font-family: "Cairo", sans-serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1.6;
    color: #5A5A5A;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>

    <div class="brand">
      <span class="dot"></span>
      <span>{{BRAND}}</span>
    </div>

    <h1 class="title">{{TITLE}}</h1>

    <div class="who">
      <div class="name">{{AUTHOR}}</div>
      <div class="role">{{ROLE}}</div>
    </div>
  </div>
</body>
</html>
